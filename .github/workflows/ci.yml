name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Redis and zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q redis-server zsh
      - name: Install Redis (macOS)
        if: runner.os == 'macOS'
        run: brew install redis
      - name: Tests under bash
        run: bash test/run.sh
      - name: Tests under the system bash (macOS, 3.2)
        if: runner.os == 'macOS'
        run: /bin/bash test/run.sh
      - name: Tests under zsh
        run: zsh test/run.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x spend-gate.sh bin/spend-gate test/run.sh test/no-internal-names.sh
      - name: No internal names or paths
        run: bash test/no-internal-names.sh
